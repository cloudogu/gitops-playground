apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: ${namespace}
  name: ${name}
rules:
  - apiGroups: [ "" ]
    resources: [ "pods", "persistentvolumeclaims" ]
    verbs: [ "deletecollection" ]

  - apiGroups: [ "" ]
    resources: [ "pods/exec" ]
    verbs: [ "create", "delete", "deletecollection", "get", "list", "patch", "update", "watch" ]
