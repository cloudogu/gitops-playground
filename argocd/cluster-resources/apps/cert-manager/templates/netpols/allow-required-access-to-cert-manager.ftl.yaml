apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-cert-manager-ingress
  namespace: ${namespace}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: cert-manager
  policyTypes:
    - Ingress
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-required-access-to-cert-manager-webhook
  namespace: ${namespace}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: cert-manager
      app.kubernetes.io/component: webhook
  policyTypes:
    - Ingress
  # The Kubernetes API server is not represented by a portable pod or namespace selector.
  # Restrict its required admission-webhook access to the webhook port instead.
  ingress:
    - ports:
        - protocol: TCP
          port: 10250
