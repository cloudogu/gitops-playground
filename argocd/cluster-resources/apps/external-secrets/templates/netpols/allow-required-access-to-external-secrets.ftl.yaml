apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-external-secrets-ingress
  namespace: ${namespace}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: external-secrets
  policyTypes:
    - Ingress
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-required-access-to-external-secrets-webhook
  namespace: ${namespace}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: external-secrets
      app.kubernetes.io/name: external-secrets-webhook
  policyTypes:
    - Ingress
  # The Kubernetes API server is not represented by a portable pod or namespace selector.
  # Restrict its required admission/conversion-webhook access to the webhook port instead.
  ingress:
    - ports:
        - protocol: TCP
          port: 10250
