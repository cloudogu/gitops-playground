<#if config.application.netpols == true>
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-required-access-to-argocd-server
  namespace: "${config.application.namePrefix}${config.features.argocd.namespace}"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  policyTypes:
    - Ingress
<#assign hasServerIngress = config.features.ingress.active || config.application.openshift || config.features.monitoring.active>
<#if hasServerIngress>
  ingress:
<#if config.features.ingress.active>
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "${config.application.namePrefix}${config.features.ingress.namespace}"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        # ArgoCD Operator 0.17 generates an unnamed server container port.
        - protocol: TCP
          port: 8080
</#if>
<#if config.application.openshift>
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
      ports:
        - protocol: TCP
          port: 8080
</#if>
<#if config.features.monitoring.active>
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "${config.application.namePrefix}${config.features.monitoring.namespace}"
          podSelector:
            matchLabels:
              prometheus: kube-prometheus-stack-prometheus
      ports:
        # ArgoCD Operator 0.17 generates an unnamed metrics container port.
        - protocol: TCP
          port: 8083
</#if>
<#else>
  ingress: []
</#if>
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-required-access-to-argocd-repo-server
  namespace: "${config.application.namePrefix}${config.features.argocd.namespace}"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-repo-server
  policyTypes:
    - Ingress
<#if config.application.networkPolicies.argocdRepoServerEgressIsolation && config.application.networkPolicies.argocdRepoServerEgress?has_content>
    - Egress
</#if>
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-server
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-application-controller
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-notifications-controller
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-applicationset-controller
      ports:
        - protocol: TCP
          port: server
<#if config.features.monitoring.active>
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "${config.application.namePrefix}${config.features.monitoring.namespace}"
          podSelector:
            matchLabels:
              prometheus: kube-prometheus-stack-prometheus
      ports:
        - protocol: TCP
          port: metrics
</#if>
<#if config.application.networkPolicies.argocdRepoServerEgressIsolation && config.application.networkPolicies.argocdRepoServerEgress?has_content>
  egress:
    # Repository host names must remain resolvable while egress isolation is active.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The repo server uses Redis internally. Keep this cluster-local dependency reachable.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-redis
      ports:
        - protocol: TCP
          port: 6379
<#list config.application.networkPolicies.argocdRepoServerEgress as connection>
    # External connection: ${connection.name}
    - to:
<#list connection.cidrs as cidr>
        - ipBlock:
            cidr: ${cidr}
</#list>
      ports:
<#list connection.ports as port>
        - protocol: ${port.protocol}
          port: ${port.port}
</#list>
</#list>
</#if>

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-required-access-to-argocd-application-controller
  namespace: "${config.application.namePrefix}${config.features.argocd.namespace}"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-application-controller
  policyTypes:
    - Ingress
<#if config.features.monitoring.active>
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "${config.application.namePrefix}${config.features.monitoring.namespace}"
          podSelector:
            matchLabels:
              prometheus: kube-prometheus-stack-prometheus
      ports:
        # ArgoCD Operator 0.17 generates an unnamed metrics container port.
        - protocol: TCP
          port: 8082
<#else>
  ingress: []
</#if>
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-required-access-to-argocd-applicationset-controller
  namespace: "${config.application.namePrefix}${config.features.argocd.namespace}"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-applicationset-controller
  policyTypes:
    - Ingress
  # GOP does not expose the ApplicationSet webhook in operator mode.
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-required-access-to-argocd-notifications-controller
  namespace: "${config.application.namePrefix}${config.features.argocd.namespace}"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-notifications-controller
  policyTypes:
    - Ingress
<#if config.features.monitoring.active>
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "${config.application.namePrefix}${config.features.monitoring.namespace}"
          podSelector:
            matchLabels:
              prometheus: kube-prometheus-stack-prometheus
      ports:
        # ArgoCD Operator 0.17 exposes notifications metrics on an unnamed container port.
        - protocol: TCP
          port: 9001
<#else>
  ingress: []
</#if>
</#if>
