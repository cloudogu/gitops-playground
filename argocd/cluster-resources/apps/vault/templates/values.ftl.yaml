<#assign DockerImageParser=statics['com.cloudogu.gitops.utils.DockerImageParser']>
  <#assign vaultOidc = (config.features.secrets.vault.oidc)!{}>
ui:
  enabled: true
  externalPort: 80
  serviceType: ClusterIP
injector:
  enabled: false
<#if config.registry.createImagePullSecrets == true>
global:
  imagePullSecrets:
  - name: proxy-registry
</#if>
<#if config.features.secrets.vault.helm.image?has_content 
  || host?has_content 
  || config.application.podResources == true
  || config.application.netpols == true
  || dev?has_content>
server:
</#if>
<#if config.application.netpols == true>
  networkPolicy:
    enabled: true
    ingress:
      # Vault server-to-server communication. The podSelector without a namespaceSelector
      # intentionally only matches Vault pods in this namespace.
      - from:
          - podSelector:
              matchLabels:
                app.kubernetes.io/instance: vault
                app.kubernetes.io/name: vault
        ports:
          - protocol: TCP
            port: 8200
          - protocol: TCP
            port: 8201
      # External Secrets fetches values from Vault on behalf of application namespaces.
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: ${config.features.secrets.namespace}
            podSelector:
              matchLabels:
                app.kubernetes.io/instance: external-secrets
        ports:
          - protocol: TCP
            port: 8200
<#if host?has_content && config.features.ingress.active == true>
      # Allow access through the GOP-managed ingress controller when Vault has an ingress.
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: ${config.features.ingress.namespace}
            podSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
        ports:
          - protocol: TCP
            port: 8200
</#if>
</#if>
<#if config.features.secrets.vault.helm.image?has_content>
<#assign imageObject = DockerImageParser.parse(config.features.secrets.vault.helm.image)>
  image:
      repository: ${imageObject.registryAndRepositoryAsString}
      tag: ${imageObject.tag}
</#if>
  
<#if host?has_content>
  ingress:
    enabled: true
    hosts:
      - host: ${host}
<#if config.features.certManager.active!false>
    annotations:
      cert-manager.io/cluster-issuer: ${config.features.certManager.issuer}
    tls:
      - secretName: vault-tls
        hosts:
        - ${host}
</#if>  
</#if>
<#if dev?has_content>
  dev:
    enabled: true
    devRootToken: ${dev.rootToken}
  volumes:
  - name: ${dev.vaultPostStartVolume}
    configMap:
      name: ${dev.vaultPostStartConfigMap}
      defaultMode: 0774
  volumeMounts:
  - mountPath: /var/opt/scripts
    name: ${dev.vaultPostStartVolume}
    readOnly : true
  extraSecretEnvironmentVars:
    - envName: USERNAME
      secretName: ${dev.userCredentialsSecret}
      secretKey: username
    - envName: PASSWORD
      secretName: ${dev.userCredentialsSecret}
      secretKey: password
  postStart:
        - /bin/sh
        - -c
        - | 
          ARGOCD=${config.features.argocd.active?c} \
<#if vaultOidc?has_content && vaultOidc.enabled>
          OIDC_ENABLED=true \
          OIDC_CLIENT_ID=${vaultOidc.clientId} \
          OIDC_CLIENT_SECRET=${vaultOidc.clientSecret} \
          OIDC_DISCOVERY_URL=${vaultOidc.issuerUrl} \
          OIDC_ADMIN_GROUP=${vaultOidc.adminGroupName} \
          VAULT_EXTERNAL_URL=http://${host} \
<#else>
          OIDC_ENABLED=false \
</#if>
          /var/opt/scripts/${dev.postStartScriptName} 2>&1 | tee /tmp/dev-post-start.log
</#if>

<#if config.application.podResources == true>
  resources:
      limits:
        memory: 200Mi
        cpu: 500m
      requests:
        memory: 100Mi
        cpu: 50m
</#if>
