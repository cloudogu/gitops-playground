apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-required-access-to-traefik
  namespace: ${namespace}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes:
    - Ingress
  ingress:
    # Traefik is the public entry point. Keep only its named public ports reachable from arbitrary sources.
    - ports:
        - protocol: TCP
          port: web
        - protocol: TCP
          port: websecure
<#if monitoringActive>
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ${monitoringNamespace}
          podSelector:
            matchLabels:
              prometheus: kube-prometheus-stack-prometheus
      ports:
        - protocol: TCP
          port: metrics
</#if>
